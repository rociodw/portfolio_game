<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trayectoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #12110f;
      --panel: #141311;
      --cream: #f4f0e6;
      --dim: #a39e93;
      --line: rgba(244, 240, 230, 0.16);
      --yellow: #f0d430;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--ink);
      color: var(--cream);
      font-family: "Press Start 2P", monospace;
    }

    button { font: inherit; color: inherit; }

    :focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 3px;
    }

    #app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-width: 1100px;
      margin: 0 auto;
    }

    .topbar, .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--panel);
    }

    .topbar {
      padding: 12px 14px;
      border-bottom: 2px solid var(--line);
    }

    .stage {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .topbar h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.5;
    }

    .lives { display: flex; gap: 6px; flex: none; align-items: center; }

    .lives img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      image-rendering: pixelated;
      display: block;
    }

    .counters { display: flex; gap: 8px; flex: none; }

    .counter {
      display: grid;
      grid-template-columns: 38px auto;
      grid-template-rows: auto auto;
      column-gap: 8px;
      align-items: center;
      min-width: 132px;
      padding: 6px 10px 6px 6px;
      border: 2px solid var(--line);
    }

    .counter img {
      grid-row: 1 / span 2;
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .counter .n { font-size: 11px; line-height: 1.4; }
    .counter .l {
      color: var(--dim);
      font-size: 7px;
      line-height: 1.4;
      text-transform: uppercase;
    }

    #world {
      position: relative;
      overflow: hidden;
      background: #3a3a3a;
      touch-action: none;
    }

    #strip { position: absolute; inset: 0; z-index: 0; pointer-events: none; }

    .bg-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .bg-img {
      position: absolute;
      left: 0;
      width: 100%;
      height: 100%;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      background-position: left bottom;
    }

    .actor, .ent {
      position: absolute;
      z-index: 1;
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      pointer-events: none;
    }

    .ent img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .hud {
      min-height: 78px;
      padding: 0 14px 0 18px;
      border-top: 2px solid var(--line);
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .toast img {
      width: 54px;
      height: 54px;
      object-fit: contain;
      flex: none;
    }

    .toast .name {
      margin: 0;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.55;
    }

    .hud-actions { display: flex; gap: 8px; flex: none; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 2px solid var(--cream);
      background: var(--cream);
      color: var(--ink);
      padding: 12px 14px;
      font-size: 10px;
      cursor: pointer;
    }

    .btn.ghost { background: transparent; color: var(--cream); }

    .btn:disabled { opacity: 0.35; cursor: default; }

    .icon-btn { width: 48px; height: 48px; padding: 0; }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(12, 11, 10, 0.62);
      padding: 20px;
    }

    #overlay.on { display: flex; }

    .card {
      width: min(440px, 100%);
      padding: 22px;
      background: var(--panel);
      border: 2px solid var(--cream);
      max-height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
    }

    .card.wide { width: min(960px, 100%); }

    #summary { margin: 14px 0 18px; overflow: auto; min-height: 0; }

    #summary table {
      width: 100%;
      border-collapse: collapse;
      font-size: 8px;
      line-height: 1.65;
    }

    #summary th, #summary td {
      border-bottom: 2px solid var(--line);
      text-align: left;
      vertical-align: top;
      padding: 8px 6px;
    }

    #summary th { color: var(--dim); font-weight: 400; }

    .card h2 {
      margin: 12px 0 0;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.45;
    }

    .card p {
      margin: 14px 0 18px;
      color: var(--dim);
      font-size: 10px;
      line-height: 1.7;
    }

    .kicker {
      margin: 0;
      color: var(--dim);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 720px) {
      .topbar { flex-wrap: wrap; align-items: flex-start; }
      .stage { flex: 1; }
      .topbar h1 { font-size: 8px; }
      .counters { width: 100%; justify-content: flex-end; }
      .lives img { width: 22px; height: 22px; }
      #summary table { font-size: 7px; }
      .counter { min-width: 0; grid-template-columns: 26px auto; padding: 4px 6px; }
      .counter img { width: 26px; height: 26px; }
      .counter .l { display: none; }
      .counter .n { font-size: 8px; }
      .toast img { width: 40px; height: 40px; }
      .toast .name { font-size: 8px; }
      .hud { min-height: 72px; padding: 0 8px 0 10px; }
      .icon-btn { width: 40px; height: 40px; }
      .card h2 { font-size: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #runner.run { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="stage">
        <h1 id="stage-name">Publicidad y Turismo</h1>
        <div class="lives" id="lives" aria-label="3 vidas">
          <img src="assets/vidas/vida.png" alt="">
          <img src="assets/vidas/vida.png" alt="">
          <img src="assets/vidas/vida.png" alt="">
        </div>
      </div>
      <div class="counters">
        <div class="counter">
          <img src="assets/objetos/puzzle.png" alt="">
          <span class="n" id="n-knowledge">00</span>
          <span class="l">Conocimientos</span>
        </div>
        <div class="counter">
          <img src="assets/objetos/skill.png" alt="">
          <span class="n" id="n-skill">00</span>
          <span class="l">Habilidades</span>
        </div>
        <div class="counter">
          <img src="assets/objetos/technologies.png" alt="">
          <span class="n" id="n-tech">00</span>
          <span class="l">Tecnologías</span>
        </div>
      </div>
    </header>
    <div id="world"></div>
    <footer class="hud">
      <div class="toast">
        <img id="toast-icon" alt="" hidden>
        <p class="name" id="toast-name"></p>
      </div>
      <div class="hud-actions">
        <button class="btn ghost icon-btn" id="mute" type="button" aria-label="Activar sonido" title="Activar sonido">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M4 10h3l4-3v10l-4-3H4z"></path>
            <path d="M16 9l5 6M21 9l-5 6"></path>
          </svg>
        </button>
        <button class="btn" id="pause" type="button">Pausa</button>
      </div>
    </footer>
  </div>
  <div id="overlay" class="on">
    <div class="card">
      <p class="kicker" id="overlay-kicker">3 vidas</p>
      <h2 id="overlay-title">Recorre mi trayectoria</h2>
      <p id="overlay-copy">El recorrido empieza con el primer salto o la primera agachada. Espacio o un toque para saltar. Flecha abajo, o deslizar hacia abajo, para agacharse.</p>
      <div id="summary" hidden></div>
      <button class="btn" id="start" type="button">Empezar</button>
    </div>
  </div>
  <script>
    const ICONS = {
      knowledge: "assets/objetos/puzzle.png",
      skill: "assets/objetos/skill.png",
      tech: "assets/objetos/technologies.png"
    };

    const POSES = {
      run1: "assets/avatar/andar_1.png",
      run2: "assets/avatar/andar_2.png",
      duck: "assets/avatar/agachar.png",
      dead: "assets/avatar/muerto.png",
      jump: "assets/avatar/saltar.png"
    };

    function holdFor(name) {
      const words = name.replace(/[.,]/g, " ").trim().split(/\s+/).filter(Boolean).length;
      if (words >= 7) return 3.6;
      if (words >= 6) return 3.3;
      if (words >= 4) return 2.6;
      return 2.2;
    }

    function item(type, name) {
      return { type, name: name.trim().replace(/\.$/, ""), hold: holdFor(name) };
    }

    const STAGES = [
      {
        name: "Publicidad y Turismo",
        bg: "assets/escenarios/1_publicidad_turismo.png",
        ground: 0.247,
        min: 16,
        jump: "assets/obstaculos/1_saltar_libros.png",
        duck: "assets/obstaculos/1_esquivar_avion.png",
        items: [
          item("skill", "Creatividad"),
          item("skill", "Trabajo en equipo"),
          item("knowledge", "Marketing e investigación de mercados"),
          item("knowledge", "Estrategias de comunicación"),
          item("knowledge", "Identidad de marca")
        ]
      },
      {
        name: "Recepción de hotel",
        bg: "assets/escenarios/2_hotel.png",
        ground: 0.249,
        min: 10,
        jump: "assets/obstaculos/2_saltar_maleta.png",
        duck: "assets/obstaculos/2_esquivar_avion.png",
        items: [item("skill", "Orientación al cliente")]
      },
      {
        name: "FREAAE",
        bg: "assets/escenarios/3_freaae.png",
        ground: 0.227,
        min: 12,
        jump: "assets/obstaculos/3_saltar_cavaletti.png",
        duck: "assets/obstaculos/3_esquivar_tejado.png",
        items: [
          item("knowledge", "Comunicación institucional y notas de prensa"),
          item("knowledge", "Identidad corporativa y manual de marca")
        ]
      },
      {
        name: "Oficina turística",
        bg: "assets/escenarios/4_oficina_turistica.png",
        ground: 0.238,
        min: 14,
        jump: "assets/obstaculos/4_saltar_llaves.png",
        duck: "assets/obstaculos/4_esquivar_gaviota.png",
        items: [
          item("tech", "WIX"),
          item("skill", "Resolución de problemas"),
          item("skill", "Gestión del tiempo"),
          item("knowledge", "Creación de web destinado a alquiler"),
          item("knowledge", "Creación y gestión de contenidos"),
          item("knowledge", "Diseño y redacción publicitaria")
        ]
      },
      {
        name: "Máster full stack",
        bg: "assets/escenarios/5_cei.png",
        ground: 0.224,
        min: 20,
        jump: "assets/obstaculos/5_saltar_code.png",
        duck: "assets/obstaculos/5_esquivar_error.png",
        items: [
          item("tech", "Visual Studio Code, GitHub y Terminal"),
          item("tech", "JavaScript y React"),
          item("tech", "MySQL"),
          item("tech", "HTML, CSS, SASS, Tailwind CSS, Bootstrap"),
          item("skill", "Pensamiento lógico"),
          item("skill", "Aprendizaje autónomo"),
          item("knowledge", "Integraciones APIs"),
          item("knowledge", "Desarrollo frontend y maquetación"),
          item("knowledge", "Desarrollo backend")
        ]
      },
      {
        name: "Cine",
        bg: "assets/escenarios/6_cine.png",
        ground: 0.227,
        min: 8,
        jump: "assets/obstaculos/6_saltar_palomitas.png",
        duck: "assets/obstaculos/6_esquivar_et.png",
        items: [item("skill", "Agilidad y gestión del estrés")]
      },
      {
        name: "Diseño UX",
        bg: "assets/escenarios/7_google_ux.png",
        ground: 0.211,
        min: 18,
        jump: "assets/obstaculos/7_saltar_prototipo.png",
        duck: "assets/obstaculos/7_esquivar_cardSorting.png",
        items: [
          item("tech", "Figma"),
          item("tech", "Wordpress"),
          item("skill", "Empatía"),
          item("knowledge", "Diseño centrado en usuarios"),
          item("knowledge", "Accesibilidad"),
          item("knowledge", "Design Thinking"),
          item("knowledge", "Investigación de usuarios y pruebas de usabilidad"),
          item("knowledge", "Arquitectura de la información y diseño de interacción"),
          item("knowledge", "Wireframes y prototipado")
        ]
      },
      {
        name: "Diseñadora web",
        bg: "assets/escenarios/8_labs.png",
        ground: 0.211,
        min: 22,
        jump: "assets/obstaculos/8_saltar_carritoCompra.png",
        duck: "assets/obstaculos/8_esquivar_menu.png",
        items: [
          item("tech", "Shopify"),
          item("tech", "Chat GPT, Cursor y Codex"),
          item("tech", "PrestaShop"),
          item("tech", "Webflow"),
          item("skill", "Autonomía y gestión de proyectos"),
          item("skill", "Creatividad y orientación al detalle"),
          item("skill", "Aprendizaje continuo y adaptación"),
          item("skill", "Pensamiento analítico y resolución de problemas"),
          item("skill", "Iniciativa"),
          item("knowledge", "Ecommerce y ecosistema de Shopify"),
          item("knowledge", "Gestión y estructuración de catálogos de moda"),
          item("knowledge", "Migración, sincronización de datos e integraciones"),
          item("knowledge", "Automatización e IA aplicada"),
          item("knowledge", "Auditoria, usabilidad y control de calidad de la web")
        ]
      }
    ];

    const GROUND = 0.247;

    function buildSchedule() {
      let cursor = 0;
      const events = [];
      const lanes = ["high", "run", "low"];
      STAGES.forEach((stage, stageIndex) => {
        stage.start = cursor;
        stage.speed = Math.min(340, 190 + (stage.items.length + 1) * 10);
        const gap = (pixels) => Math.max(1.2, pixels / stage.speed);
        const approach = gap(300);
        let t = cursor + (stageIndex === 0 ? 3 : gap(320));
        let nextEarliest = cursor;
        let obstacle = "jump";
        stage.items.forEach((entry, index) => {
          const lane = lanes[index % 3];
          const itemMeet = Math.max(t + approach, nextEarliest);
          const obsMeet = itemMeet - approach;
          events.push({ meet: obsMeet, kind: obstacle, stageIndex });
          events.push({
            meet: itemMeet,
            kind: "item",
            lane,
            stageIndex,
            type: entry.type,
            name: entry.name
          });
          const after = Math.max(gap(280), entry.hold);
          t = itemMeet + after;
          nextEarliest = itemMeet + entry.hold;
          obstacle = obstacle === "jump" ? "duck" : "jump";
        });
        events.push({ meet: t, kind: obstacle, stageIndex });
        stage.end = t + gap(320);
        cursor = stage.end;
      });
      events.sort((a, b) => a.meet - b.meet);
      return { events, duration: cursor };
    }

    const schedule = buildSchedule();
    const assetVersion = Date.now();
    function asset(src) {
      return `${src}?v=${assetVersion}`;
    }
    document.querySelectorAll("img[src^='assets/']").forEach((img) => {
      img.src = asset(img.getAttribute("src"));
    });
    const world = document.getElementById("world");
    const strip = document.createElement("div");
    strip.id = "strip";
    STAGES.forEach((stage) => {
      const panel = document.createElement("div");
      panel.className = "bg-panel";
      const image = document.createElement("div");
      image.className = "bg-img";
      image.style.backgroundImage = `url("${asset(stage.bg)}")`;
      panel.appendChild(image);
      strip.appendChild(panel);
    });
    world.appendChild(strip);
    const runner = document.createElement("div");
    runner.id = "runner";
    runner.className = "actor";
    world.appendChild(runner);

    const boundsCache = new Map();
    const images = new Map();

    function loadImage(src) {
      if (images.has(src)) return images.get(src);
      const promise = new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
      images.set(src, promise);
      return promise;
    }

    function measure(img) {
      if (boundsCache.has(img.src)) return boundsCache.get(img.src);
      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.drawImage(img, 0, 0);
      const data = context.getImageData(0, 0, canvas.width, canvas.height).data;
      let minX = canvas.width;
      let minY = canvas.height;
      let maxX = 0;
      let maxY = 0;
      for (let y = 0; y < canvas.height; y += 2) {
        for (let x = 0; x < canvas.width; x += 2) {
          if (data[(y * canvas.width + x) * 4 + 3] > 28) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      const box = { minX, minY, maxX, maxY, w: canvas.width, h: canvas.height };
      boundsCache.set(img.src, box);
      return box;
    }

    const state = {
      mode: "ready",
      time: 0,
      last: 0,
      lives: 3,
      invuln: 0,
      jumpY: 0,
      vy: 0,
      duck: false,
      wantDuck: false,
      audio: false,
      counts: { knowledge: 0, skill: 0, tech: 0 },
      speed: 300,
      gravity: 2600,
      frame: 0,
      entities: []
    };

    let audioCtx = null;

    function beep(freq, dur) {
      if (!state.audio) return;
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = freq;
      gain.gain.value = 0.04;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.stop(audioCtx.currentTime + dur);
    }

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function distanceUntil(time) {
      let dist = 0;
      let cursor = 0;
      for (const stage of STAGES) {
        const end = Math.min(time, stage.end);
        if (end > cursor) dist += (end - cursor) * stage.speed;
        if (time <= stage.end) break;
        cursor = stage.end;
      }
      return dist;
    }

    function stageAt(time) {
      return STAGES.find((stage) => time >= stage.start && time < stage.end) || STAGES[STAGES.length - 1];
    }

    function worldSize() {
      return { w: world.clientWidth, h: world.clientHeight };
    }

    function runnerSize(h) {
      return Math.max(120, Math.min(230, h * 0.38));
    }

    function contentRect(box, left, bottom, width, height, inset) {
      const sx = width / box.w;
      const sy = height / box.h;
      const x1 = left + box.minX * sx;
      const x2 = left + box.maxX * sx;
      const yTop = bottom + (box.h - box.minY) * sy;
      const yBot = bottom + (box.h - box.maxY) * sy;
      const shrinkX = (x2 - x1) * inset;
      const shrinkY = (yTop - yBot) * inset;
      return {
        x1: x1 + shrinkX,
        x2: x2 - shrinkX,
        y1: yBot + shrinkY,
        y2: yTop - shrinkY
      };
    }

    function overlaps(a, b) {
      return a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;
    }

    function showOverlay(title, copy, button, kicker) {
      document.getElementById("overlay-title").textContent = title;
      const text = document.getElementById("overlay-copy");
      text.hidden = !copy;
      text.textContent = copy || "";
      if (kicker !== "Resumen") {
        document.getElementById("summary").hidden = true;
        document.querySelector("#overlay .card").classList.remove("wide");
      }
      document.getElementById("overlay-kicker").textContent = kicker;
      document.getElementById("start").textContent = button;
      document.getElementById("overlay").classList.add("on");
    }

    function hideOverlay() {
      document.getElementById("overlay").classList.remove("on");
    }

    function setLives() {
      document.querySelectorAll("#lives img").forEach((icon, index) => {
        icon.src = asset(index < state.lives ? "assets/vidas/vida.png" : "assets/vidas/sin_vida.png");
      });
      document.getElementById("lives").setAttribute("aria-label", `${state.lives} vidas`);
    }

    function syncControls() {
      document.getElementById("pause").disabled = state.mode !== "playing";
    }

    function setToast(entry) {
      const icon = document.getElementById("toast-icon");
      const name = document.getElementById("toast-name");
      if (!entry) {
        icon.hidden = true;
        name.textContent = "";
        return;
      }
      icon.hidden = false;
      icon.src = asset(ICONS[entry.type]);
      name.textContent = entry.name;
    }

    function updateCounters() {
      document.getElementById("n-knowledge").textContent = pad(state.counts.knowledge);
      document.getElementById("n-skill").textContent = pad(state.counts.skill);
      document.getElementById("n-tech").textContent = pad(state.counts.tech);
    }

    function setStageName(stage) {
      document.getElementById("stage-name").textContent = stage.name;
    }

    function resetGame() {
      state.mode = "ready";
      state.time = 0;
      state.lives = 3;
      state.invuln = 0;
      state.jumpY = 0;
      state.vy = 0;
      state.duck = false;
      state.wantDuck = false;
      state.counts = { knowledge: 0, skill: 0, tech: 0 };
      state.entities.forEach((entity) => entity.el.remove());
      state.entities = schedule.events.map((event) => {
        const el = document.createElement("img");
        el.className = "ent";
        el.alt = "";
        const stage = STAGES[event.stageIndex];
        if (event.kind === "item") el.src = asset(ICONS[event.type]);
        else el.src = asset(event.kind === "jump" ? stage.jump : stage.duck);
        el.hidden = true;
        world.appendChild(el);
        return { ...event, el, done: false };
      });
      setLives();
      updateCounters();
      setToast(null);
      setStageName(STAGES[0]);
      syncControls();
    }

    function engage() {
      if (state.mode !== "ready" && state.mode !== "hold") return;
      state.mode = "playing";
      state.last = 0;
      hideOverlay();
      syncControls();
    }

    function jump() {
      if (state.mode === "ready" || state.mode === "hold") engage();
      if (state.mode !== "playing") return;
      if (state.jumpY > 1 || state.duck) return;
      state.vy = Math.sqrt(2 * state.gravity * state.jumpApex);
      state.jumpY = 0.1;
      beep(520, 0.08);
    }

    function tick(now) {
      if (!state.last) state.last = now;
      const dt = Math.min(0.033, (now - state.last) / 1000);
      state.last = now;
      if (state.mode === "playing") {
        state.time += dt;
        state.invuln = Math.max(0, state.invuln - dt);
        const onGround = state.jumpY <= 0;
        state.duck = state.wantDuck && onGround;
        if (!onGround) {
          state.vy -= state.gravity * dt;
          state.jumpY += state.vy * dt;
          if (state.jumpY <= 0) {
            state.jumpY = 0;
            state.vy = 0;
          }
        }
        if (state.time >= schedule.duration) win();
      }
      render();
      requestAnimationFrame(tick);
    }

    function playerPose() {
      if (state.mode === "dead") return "dead";
      if (state.jumpY > 2) return "jump";
      if (state.duck) return "duck";
      return state.frame % 2 === 0 ? "run1" : "run2";
    }

    function render() {
      const { w, h } = worldSize();
      if (!w || !h) return;
      const stage = stageAt(state.time);
      if (world.dataset.stage !== stage.name) {
        world.dataset.stage = stage.name;
        setStageName(stage);
      }
      const ground = GROUND * h;
      const stageIndex = STAGES.indexOf(stage);
      STAGES.forEach((scene, index) => {
        const panel = strip.children[index];
        panel.hidden = index !== stageIndex;
        if (index === stageIndex) {
          panel.firstElementChild.style.bottom = `${(GROUND - scene.ground) * h}px`;
        }
      });
      const size = runnerSize(h);
      const poseKey = playerPose();
      const poseImg = poseImages[poseKey];
      const poseBox = boundsCache.get(poseImg.src);
      if (!poseBox) return;
      const feetPad = (poseBox.h - poseBox.maxY) / poseBox.h;
      runner.style.width = `${size}px`;
      runner.style.height = `${size}px`;
      runner.style.left = "28px";
      runner.style.bottom = `${ground - feetPad * size + state.jumpY}px`;
      runner.style.backgroundImage = `url("${poseImg.src}")`;
      runner.style.opacity = state.invuln > 0 && Math.floor(state.time * 12) % 2 === 0 ? "0.45" : "1";
      if (state.mode === "playing" && state.jumpY === 0 && !state.duck) {
        if (Math.floor(state.time * 8) !== state.frame) state.frame = Math.floor(state.time * 8);
      }

      const playerRect = contentRect(
        poseBox,
        28,
        ground - feetPad * size + state.jumpY,
        size,
        size,
        state.duck ? 0.08 : 0.16
      );

      state.entities.forEach((entity) => {
        if (entity.done) {
          entity.el.hidden = true;
          return;
        }
        const box = boundsCache.get(entity.el.src);
        if (!box) return;
        const scene = STAGES[entity.stageIndex];
        let width = entity.kind === "item" ? size * 0.28 : size * (entity.kind === "jump" ? 0.72 : 0.64);
        let height = width * (box.h / box.w);
        const contentCenter = (box.minX + box.maxX) / 2 / box.w;
        const centerX = 28 + size * ((poseBox.minX + poseBox.maxX) / 2 / poseBox.w) + distanceUntil(entity.meet) - distanceUntil(state.time);
        let bottom;
        if (entity.kind === "item") {
          const runBox = boundsCache.get(poseImages.run1.src);
          const span = ((runBox.maxY - runBox.minY) / runBox.h) * size;
          const head = span * 0.84;
          const lift = entity.lane === "high"
            ? Math.max(head + 36, state.jumpApex - 18)
            : entity.lane === "low"
              ? span * 0.16
              : span * 0.46;
          const torso = ground + lift;
          const contentMid = ((box.h - box.minY) + (box.h - box.maxY)) / 2 / box.h;
          bottom = torso - contentMid * height;
        } else if (entity.kind === "jump") {
          const runBox = boundsCache.get(poseImages.run1.src);
          const playerW = ((runBox.maxX - runBox.minX) / runBox.w) * size * 0.68;
          const airTravel = scene.speed * 0.62;
          const maxContentW = Math.max(28, airTravel * 0.62 - playerW);
          const contentW = ((box.maxX - box.minX) / box.w) * width;
          if (contentW > maxContentW) {
            const scale = maxContentW / contentW;
            width *= scale;
            height *= scale;
          }
          const contentH = ((box.maxY - box.minY) / box.h) * height;
          const limit = state.jumpApex - 34;
          if (contentH > limit) {
            const scale = limit / contentH;
            width *= scale;
            height *= scale;
          }
          const feet = (box.h - box.maxY) / box.h;
          bottom = ground - feet * height;
        } else {
          const runBox = boundsCache.get(poseImages.run1.src);
          const duckBox = boundsCache.get(poseImages.duck.src);
          const span = (pose) => ((pose.maxY - pose.minY) / pose.h) * size;
          const standTop = span(runBox) * 0.84;
          const duckTop = span(duckBox) * 0.92;
          const contentH = ((box.maxY - box.minY) / box.h) * height;
          const contentBottom = ground + (duckTop + standTop) / 2 - contentH * 0.12;
          const contentBottomPad = (box.h - box.maxY) / box.h;
          bottom = contentBottom - contentBottomPad * height;
        }
        const left = centerX - contentCenter * width;
        entity.el.hidden = left > w + 40 || left + width < -40;
        entity.el.style.left = `${left}px`;
        entity.el.style.bottom = `${bottom}px`;
        entity.el.style.width = `${width}px`;
        entity.el.style.height = `${height}px`;
        if (state.mode !== "playing" || entity.el.hidden) return;
        const rect = contentRect(box, left, bottom, width, height, entity.kind === "item" ? 0.05 : 0.12);
        if (!overlaps(playerRect, rect)) return;
        if (entity.kind === "item") collect(entity);
        else hit();
      });
    }

    function collect(entity) {
      entity.done = true;
      entity.el.hidden = true;
      entity.got = true;
      state.counts[entity.type] += 1;
      updateCounters();
      setToast(entity);
      beep(740, 0.06);
    }

    function hit() {
      if (state.invuln > 0 || state.mode !== "playing") return;
      state.lives -= 1;
      setLives();
      beep(140, 0.16);
      if (state.lives <= 0) {
        state.mode = "dead";
        state.jumpY = 0;
        state.vy = 0;
        showOverlay("Se acabó", "Has perdido las tres vidas. La trayectoria puede volver a empezar.", "Reintentar", stageAt(state.time).name);
        syncControls();
        return;
      }
      state.invuln = 1.4;
    }

    function win() {
      state.mode = "won";
      const summary = document.getElementById("summary");
      const rows = STAGES.map((stage, index) => {
        const got = state.entities.filter((entity) => entity.kind === "item" && entity.stageIndex === index && entity.got);
        const cell = (type) => {
          const names = got.filter((entity) => entity.type === type).map((entity) => entity.name);
          return names.length ? names.join("<br>") : "—";
        };
        return `<tr><td>${stage.name}</td><td>${cell("knowledge")}</td><td>${cell("skill")}</td><td>${cell("tech")}</td></tr>`;
      }).join("");
      summary.innerHTML = `<table><thead><tr><th>Sección</th><th>Conocimientos</th><th>Habilidades</th><th>Tecnologías</th></tr></thead><tbody>${rows}</tbody></table>`;
      summary.hidden = false;
      document.querySelector("#overlay .card").classList.add("wide");
      showOverlay("Trayectoria completa", "", "Otra vez", "Resumen");
      syncControls();
    }

    const poseImages = {};

    Promise.all(
      [...Object.values(POSES), ...Object.values(ICONS), ...STAGES.flatMap((stage) => [stage.bg, stage.jump, stage.duck])]
        .map((src) => loadImage(asset(src)))
    ).then((loaded) => {
      loaded.forEach((img) => measure(img));
      Object.keys(POSES).forEach((key) => {
        const match = loaded.find((img) => img.src.includes(POSES[key].split("/").pop()));
        poseImages[key] = match;
      });
      state.jumpApex = 128;
      state.gravity = (8 * state.jumpApex) / (0.62 * 0.62);
      resetGame();
      requestAnimationFrame(tick);
    });

    function resume() {
      if (state.mode !== "paused") return;
      state.mode = "playing";
      state.last = 0;
      hideOverlay();
      syncControls();
    }

    document.getElementById("start").addEventListener("click", () => {
      if (state.mode === "paused") {
        resume();
        return;
      }
      if (state.mode === "dead" || state.mode === "won") resetGame();
      if (state.mode !== "ready") return;
      state.mode = "hold";
      state.last = 0;
      hideOverlay();
      syncControls();
    });

    document.getElementById("pause").addEventListener("click", () => {
      if (state.mode !== "playing") return;
      state.mode = "paused";
      syncControls();
      showOverlay("Pausa", `La partida sigue en ${stageAt(state.time).name}. Nada avanza hasta que sigas.`, "Reanudar", "Pausa");
    });

    document.getElementById("mute").addEventListener("click", () => {
      state.audio = !state.audio;
      const button = document.getElementById("mute");
      button.setAttribute("aria-label", state.audio ? "Silenciar" : "Activar sonido");
      button.title = state.audio ? "Silenciar" : "Activar sonido";
      if (state.audio) beep(660, 0.05);
    });

    window.addEventListener("keydown", (event) => {
      if (event.repeat) return;
      if (event.code === "Space" || event.code === "ArrowUp") {
        event.preventDefault();
        if (state.mode === "paused") resume();
        else jump();
      }
      if (event.code === "ArrowDown") {
        event.preventDefault();
        if (state.mode === "ready" || state.mode === "hold") engage();
        state.wantDuck = true;
      }
      if (event.code === "KeyP" || event.code === "Escape") {
        if (state.mode === "playing") document.getElementById("pause").click();
        else if (state.mode === "paused") resume();
      }
    });

    window.addEventListener("keyup", (event) => {
      if (event.code === "Space" || event.code === "ArrowUp") {
        if (state.vy > 0) state.vy *= 0.45;
      }
      if (event.code === "ArrowDown") state.wantDuck = false;
    });

    let touch = null;
    world.addEventListener("pointerdown", (event) => {
      if (state.mode !== "playing" && state.mode !== "hold") return;
      touch = { y: event.clientY, ducked: false };
    });
    world.addEventListener("pointermove", (event) => {
      if (!touch) return;
      if (event.clientY - touch.y > 28) {
        state.wantDuck = true;
        touch.ducked = true;
      }
    });
    function endTouch() {
      if (!touch) return;
      const ducked = touch.ducked;
      touch = null;
      if (ducked && (state.mode === "ready" || state.mode === "hold")) engage();
      if (!ducked) jump();
      state.wantDuck = false;
    }
    world.addEventListener("pointerup", endTouch);
    world.addEventListener("pointercancel", endTouch);
  </script>
</body>
</html>
